[project]
name = "agentic-learning-system"
version = "0.1.0"
description = "An autonomous AI-powered learning system with multi-agent architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # --- Agent Orchestration ---
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # --- LLM Interface (unified provider access) ---
    "litellm>=1.50.0",

    # --- Database & ORM ---
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",       # SQLite async driver (local dev)
    "alembic>=1.14.0",         # Database migrations

    # --- Vector Store ---
    "chromadb>=0.5.0",

    # --- ML ---
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",

    # --- Configuration ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # --- Utilities ---
    "httpx>=0.27.0",           # Async HTTP client
    "rich>=13.9.0",            # Beautiful terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",           # For FastAPI test client
    "ruff>=0.7.0",             # Linter + formatter
    "mypy>=1.13.0",            # Type checking
]

postgres = [
    "asyncpg>=0.30.0",        # PostgreSQL async driver (production)
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
